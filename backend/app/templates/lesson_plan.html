{% extends "base.html" %}
{% block title %}Lesson Plan — AI Teacher{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-6 py-12">
  <div class="text-center mb-8">
    <div class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-1.5 rounded-full mb-4">
      <span>Step 3 of 3</span>
    </div>
    <h1 class="text-3xl font-bold text-slate-800 mb-1" id="plan-title">Your Lesson Plan</h1>
    <p class="text-slate-500 text-sm" id="plan-meta"></p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-6">
    <!-- Plan header -->
    <div class="px-6 py-5 border-b border-slate-100 bg-gradient-to-r from-indigo-50 to-violet-50">
      <div class="flex items-start justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-800" id="lesson-title">Loading...</h2>
          <p class="text-sm text-slate-500 mt-0.5" id="lesson-subtitle"></p>
        </div>
        <div class="text-right">
          <div class="text-2xl font-bold text-indigo-600" id="lesson-duration">--</div>
          <div class="text-xs text-slate-400">minutes</div>
        </div>
      </div>

      <!-- Objectives -->
      <div id="objectives-section" class="mt-4 hidden">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">You will learn</p>
        <ul id="objectives-list" class="space-y-1"></ul>
      </div>
    </div>

    <!-- Segments timeline -->
    <div class="p-6">
      <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-4">Lesson Segments</h3>
      <div id="segments-list" class="space-y-2">
        <div class="animate-pulse flex gap-3">
          <div class="w-8 h-8 bg-slate-200 rounded-lg"></div>
          <div class="flex-1 space-y-2 py-1">
            <div class="h-3 bg-slate-200 rounded w-3/4"></div>
            <div class="h-2 bg-slate-100 rounded w-1/2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Concept mastery preview -->
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-6">
    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-4">Concepts to Master</h3>
    <div id="concepts-list" class="flex flex-wrap gap-2"></div>
  </div>

  <!-- Start button -->
  <button id="start-lesson-btn"
          class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-4 rounded-xl text-base shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 group">
    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span id="start-btn-text">Enter AI Classroom →</span>
    <svg id="start-spinner" class="w-4 h-4 animate-spin hidden" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
  </button>
  <p id="start-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
</div>
{% endblock %}

{% block scripts %}
<script>
const SEGMENT_ICONS = {
  introduction: { icon: '🎯', color: 'bg-blue-100 text-blue-700', label: 'Introduction' },
  concept: { icon: '💡', color: 'bg-indigo-100 text-indigo-700', label: 'Concept' },
  example: { icon: '📌', color: 'bg-amber-100 text-amber-700', label: 'Example' },
  analogy: { icon: '🔗', color: 'bg-purple-100 text-purple-700', label: 'Analogy' },
  formula: { icon: '⚡', color: 'bg-cyan-100 text-cyan-700', label: 'Formula' },
  diagram: { icon: '📊', color: 'bg-teal-100 text-teal-700', label: 'Diagram' },
  graph: { icon: '📈', color: 'bg-green-100 text-green-700', label: 'Graph' },
  code: { icon: '💻', color: 'bg-slate-100 text-slate-700', label: 'Code' },
  question: { icon: '❓', color: 'bg-rose-100 text-rose-700', label: 'Question' },
  reteach: { icon: '🔄', color: 'bg-orange-100 text-orange-700', label: 'Re-teach' },
  summary: { icon: '📋', color: 'bg-emerald-100 text-emerald-700', label: 'Summary' },
  assessment: { icon: '🎓', color: 'bg-violet-100 text-violet-700', label: 'Assessment' },
};

const lessonData = JSON.parse(localStorage.getItem('lesson_info') || '{}');
const learnerId = localStorage.getItem('learner_id');

// Populate UI
document.getElementById('lesson-title').textContent = lessonData.title || 'Your Lesson';
document.getElementById('lesson-subtitle').textContent =
  `${lessonData.topic || ''} · ${lessonData.teaching_style || ''} · ${lessonData.language || ''}`;
document.getElementById('lesson-duration').textContent =
  Math.round((lessonData.duration_seconds || 600) / 60);
document.getElementById('plan-title').textContent = 'Your Lesson Plan is Ready';
document.getElementById('plan-meta').textContent =
  `${lessonData.segment_count || 0} segments · ${Math.round((lessonData.duration_seconds || 600)/60)} minutes`;

// Objectives
const objectives = lessonData.learning_objectives || [];
if (objectives.length > 0) {
  document.getElementById('objectives-section').classList.remove('hidden');
  const list = document.getElementById('objectives-list');
  objectives.forEach(obj => {
    const li = document.createElement('li');
    li.className = 'text-sm text-slate-600 flex items-start gap-2';
    li.innerHTML = `<svg class="w-3.5 h-3.5 text-emerald-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>${obj}`;
    list.appendChild(li);
  });
}

// Segments
const segList = document.getElementById('segments-list');
segList.innerHTML = '';
(lessonData.segments || []).forEach((seg, i) => {
  const info = SEGMENT_ICONS[seg.type] || { icon: '📚', color: 'bg-slate-100 text-slate-700', label: seg.type };
  const duration = Math.round((seg.duration_seconds || 60) / 60 * 10) / 10;
  const div = document.createElement('div');
  div.className = 'flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 transition-colors';
  div.innerHTML = `
    <div class="w-8 h-8 ${info.color} rounded-lg flex items-center justify-center text-sm shrink-0">${info.icon}</div>
    <div class="flex-1 min-w-0">
      <div class="text-sm font-medium text-slate-700 truncate">${seg.title || info.label}</div>
      <div class="text-xs text-slate-400">${info.label} · ${duration < 1 ? seg.duration_seconds + 's' : duration + ' min'}</div>
    </div>
    <span class="text-xs text-slate-300 font-medium">#${i + 1}</span>`;
  segList.appendChild(div);
});

// Concepts
const conceptsList = document.getElementById('concepts-list');
(lessonData.concept_keys || []).forEach(ck => {
  const span = document.createElement('span');
  span.className = 'px-3 py-1.5 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full border border-indigo-200';
  span.textContent = ck.replace(/_/g, ' ');
  conceptsList.appendChild(span);
});

// Start lesson button
document.getElementById('start-lesson-btn').addEventListener('click', async () => {
  const btn = document.getElementById('start-lesson-btn');
  const spinner = document.getElementById('start-spinner');
  const error = document.getElementById('start-error');

  btn.disabled = true;
  spinner.classList.remove('hidden');
  document.getElementById('start-btn-text').textContent = 'Starting session...';
  error.classList.add('hidden');

  try {
    const lessonId = localStorage.getItem('lesson_id');
    const resp = await fetch('/api/sessions/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ learner_id: learnerId, lesson_id: lessonId })
    });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || 'Failed to start session'); }
    const sessionData = await resp.json();

    localStorage.setItem('session_id', sessionData.session_id);
    window.location.href = '/classroom';
  } catch (err) {
    error.textContent = err.message;
    error.classList.remove('hidden');
    btn.disabled = false;
    spinner.classList.add('hidden');
    document.getElementById('start-btn-text').textContent = 'Enter AI Classroom →';
  }
});
</script>
{% endblock %}
